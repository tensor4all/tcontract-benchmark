schema_version: 1
id: qcbench

# The third timing-v2 campaign. The measured repository is `tcontract-rs`, and the
# harness (`qcbench`) is built out of the same checkout as the library it measures,
# so the recorded commit describes both. The legacy timing-v1 campaign is frozen
# evidence (`data/results/`, `result/`, `pins/tcontract-rs.rev`); this descriptor
# and the other two v2 descriptors pin the v2 revision separately.
measured:
  name: tcontract-rs
  url: https://github.com/tensor4all/tcontract-rs
  pin_file: pins/tcontract-rs-v2.rev
  extern_dir: extern/tcontract-rs-v2
  build_script: scripts/build_for_tprims_rev.sh
  binary: qcbench
  # The variable names scripts/build_for_tprims_rev.sh writes. It is a plain build
  # script: the vendor arm (there is none here) reaches it through BENCH_VENDOR and
  # the suite's `features` through BENCH_FEATURES, both exported by the recorder.
  pin_env:
    rev: TPRIMS_REV
    dirty: TPRIMS_DIRTY
    dir: TPRIMS_DIR
    features: BUILD_FEATURES
    bin_dir: BIN_DIR
  # The timing protocol belongs to the measured checkout.
  protocol: measured

# One measured revision: the library commit. No upstream baseline is recorded.
identities: [library]

profiles_file: benchmarks/profiles.yaml
# The v2 suites share one suites_dir, and the toolkit validates every suite against the
# active descriptor, so `engines` below is the union of the rows any suite may select.
# Which rows this suite actually measures is declared by the suite itself (plan, tblis).
suites_dir: benchmarks/suites-v2
data_dir: data/v2-results/qcbench
result_dir: result-v2/qcbench

# Engine row -> provider. `plan` is the measured library's own route; `ttgt` is the
# OpenBLAS-backed transpose-transpose-GEMM-transpose baseline declared for the other
# suites in this shared directory; `tblis` is the independent external reference,
# linked from its own prefix and declared as an external provider below. `packed` is
# not a row here: qcbench's suite publishes `plan` and `tblis` only.
engines:
  plan: tprims
  ttgt: openblas
  tblis: tblis

# No BLAS/LAPACK vendor arm is selected: the measured library's row and the OpenBLAS
# engine are not mutually exclusive vendor arms of this campaign.
vendor_providers: []

# A separately built native baseline whose revision is collected by the campaign's own
# TBLIS collector (`scripts/tblis_providers_json.py`), never inferred from the measured
# checkout.
external_providers: [tblis]

# The directories a measured process loads TBLIS from, so the harness can link the
# `tblis` row without rebuilding the measured checkout. Expanded from the environment.
loader_paths:
  - "$TBLIS_ROOT/lib"
  - "$TBLIS_ROOT/lib64"

# Thread-budget and tuning variables that belong to a linked library, not to the
# measurement. The harness sets the budget from the row's thread count and reads it
# back, so an inherited value must not reach the measured process.
vendor_env:
  - OMP_NUM_THREADS
  - RAYON_NUM_THREADS
  - OPENBLAS_NUM_THREADS
  - VECLIB_MAXIMUM_THREADS
  - MKL_NUM_THREADS

# The columns the harness's CSV carries, as the report and the comparison read them.
# The harness itself writes a wider header; these are the ones the toolkit consumes.
csv_columns:
  - regime
  - family
  - dtype
  - order
  - m
  - n
  - k
  - batch
  - row
  - threads
  - total_ms
  - per_item_us
  - status
  - note
  - samples_ms
  - rayon_threads
  - vendor_threads
  - case_m
  - case_n
  - case_k

# `{timing}` is empty for v1 and `-timing-v2` for this contract, so a v2 page never
# overwrites a legacy one.
page_name: "{library12}{version}{dirty}{timing}"

default_invalidated_by:
  - crates/tcontract-kernel/**
  - crates/tcontract/**
  - crates/tcontract-exec/**
  - benchmarks/benchmarks/qcbench/**
  - benchmarks/src/**
  - Cargo.toml
  - Cargo.lock

# Explicit timing-v2 opt-in.
timing:
  version: 2

report:
  subject: tcontract
  library_label: tcontract-rs commit
  provider_label: tprims rows
  harness_label: harness commit
  index_generator: python3 -m campaign_toolkit.gen_index
  setup_script: scripts/setup_v2_extern_deps.sh
  verify_note: |
    Every row below passed `{binary} verify` on the same grid before timing: the
    measured library's planner route and the forced-packed route are compared with each
    other and with the TBLIS baseline on the same inputs, and a mismatch aborts the run
    rather than publishing a number. This is a cross-provider check, not a
    recomputation from a reference implementation. Times are milliseconds, the median
    of the chronological calls per case and engine row; with more than one complete set
    repeat the table shows the best repeat, and the A/A spread is reported at its foot.
    The declared identity shape is the numeric sentinel `n = 1`: the extents are the
    harness's fixed aspect-ratio classes and are reported beside the declared spec
    rather than presented as geometry. The suite is f64 only.

# The landing page's per-case chart: one dot per case and engine row on a log time axis
# (the corpus has no common size axis to draw a throughput curve against).
figures:
  cases: [qcbench]

# Representative cases followed across pins: the (T) head, whose o^3 v^3 output binds the
# memory budget, and the packed density head with the largest single MAC count.
trend:
  - suite: qcbench
    case: qcbench:ov_10/T.connected.virtual/n1/b1 f64
    engines: [plan, tblis]
    threads: [1, 4]
  - suite: qcbench
    case: qcbench:ov_20/gamma.abcd/n1/b1 f64
    engines: [plan, tblis]
    threads: [1, 4]
