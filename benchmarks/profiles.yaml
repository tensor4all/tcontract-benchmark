# Hardware profiles. A profile is a machine (or a well-defined container on one)
# whose cells are only comparable with each other. Adding one is a deliberate
# act: an unknown profile in a run manifest is a schema error, not a warning.
schema_version: 1
profiles:
  - name: zen5-cpu
    description: >-
      AMD Ryzen AI 9 HX 470 (Zen5 mobile APU), 12 physical / 24 logical cores.
      Heterogeneous L3: CPUs 0-3 share 16 MiB, CPUs 4-11 share 8 MiB, so a
      thread set must be stated together with the domain it sits in.
    cpu: AMD Ryzen AI 9 HX 470
    logical_cpus: 24
    l3: "0-3: 16 MiB shared; 4-11: 8 MiB shared"
  # The measurement host (tensor4all-meta#76 D5), resolved against
  # `campaign_toolkit/profiles/zen2-cpu.yaml`. Every suite lists it as optional: it is
  # measured when the stack's versions move, not on the weekly schedule.
  - zen2-cpu
  # The QC benchmark's recording candidate (2026-11-11). A shared, scheduler-managed
  # build server owned by a colleague, not a dedicated measurement box: the qcbench
  # cells recorded here are this profile's own and are not comparable with zen5-cpu or
  # zen2-cpu. The role is `development` until boost-off is verified and the owner agrees
  # to treat it as a measurement host.
  - name: epyc-9575f
    description: >-
      AMD EPYC 9575F (Zen 5), 1 socket, 64 physical / 128 logical cores, 256 MiB
      L3 in 8 instances: each 8-core CCX shares 32 MiB, exposed as CPUs
      8k..8k+7 and their SMT siblings 8k+64..8k+71, so a thread set must be
      stated together with its L3 domain. Single NUMA node. A shared
      scheduler-managed build server; measuring needs an exclusive allocation,
      the measured domain idle, and CPU boost off.
    cpu: AMD EPYC 9575F 64-Core Processor
    logical_cpus: 128
    l3: "32 MiB per 8-core CCX (CPUs 8k-8k+7 plus SMT siblings 8k+64-8k+71), 8 CCXs"
    smt: {threads_per_core: 2, sibling_offset: 64}
    role: development
    power:
      cpufreq_boost: "0"
      governor: performance
    thread_rows:
      - {threads: 1, measured: "0", observer: "8-63,72-127"}
      - {threads: 4, measured: "0-3", observer: "8-63,72-127"}
