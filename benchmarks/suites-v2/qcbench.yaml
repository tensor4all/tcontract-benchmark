workloads:
  name: |-
    QC binary-contraction corpus
  description: |-
    One binary (two-operand) contraction per case, transcribed from nine QC paper routes at fixed occupied/virtual/auxiliary extents: RCCSD, RCCSD(T), EOM-IP, EOM-EA, CCSD analytic gradient, RI-HF energy and gradients, TDHF/CIS response and MO RI-J/K response. The three ratios stand for the cc-pVDZ/cc-pVTZ/cc-pVQZ rung medians of a 5,239-molecule NAO statistics panel.
  source: |-
    The corpus is defined by `benchmarks/benchmarks/qcbench/corpus.rs` in the measured revision (`pins/tcontract-rs-v2.rev`); each case names the paper it was transcribed from in the corpus README, and the transcription material lives in the benchmark job's `out/real_corpus/*/CORPUS.md`.
  known_blind_spots:
  - 'One binary contraction per timed call: permutations, denominators and forms with more than two operands
    are metadata, never separate timed cases.'
  - Every case is f64 with unit batch; a c64/c128 benchmark is out of scope, and a cost proportional to
    batch elements is invisible.
  - The extents are aspect-ratio classes derived from an 8 GiB whole-binary budget, not a molecule; the
    binding case is the (T) o^3 v^3 output and the verify peak is A+B+2C (a blas build would add the TTGT
    arm).
  - '`tblis` is an external baseline linked from its own prefix (`TBLIS_ROOT`), not the measured checkout;
    its revision is recorded through the campaign TBLIS collector (`scripts/tblis_providers_json.py`).'
  - The harness's census CSV carries no corpus `group` column, so the ratio classes are declared by this
    suite and the resolved extents remain facts of the measured revision's `corpus.rs`.
