engines_doc:
  plan:
    provider: tprims
    summary: 'This library, with its planner choosing the route per case: the packed driver, the copy-free
      faer path, or the elementwise path for an all-batch case.'
    identity: the measured tcontract-rs revision in this run's manifest (`library.commit`), pinned by
      `pins/tcontract-rs-v2.rev`
  packed:
    provider: tprims
    summary: 'This library with the packed driver forced instead of chosen. A diagnostic arm: it shows
      what the planner''s other routes buy or cost on the same inputs.'
    identity: the measured tcontract-rs revision in this run's manifest (`library.commit`), pinned by
      `pins/tcontract-rs-v2.rev`
  ttgt:
    provider: openblas
    summary: 'Transpose-transpose-GEMM-transpose against the CBLAS-compatible BLAS the harness linked:
      permute the operands into dense matrices, call GEMM, permute the result back. An engine row, not
      a vendor arm.'
    identity: the OpenBLAS the harness linked, read from the harness's `info` output
    caveat: The transposition is the naive gather, so this is an upper bound on TTGT's cost rather than
      a tuned HPTT implementation.
  tblis:
    provider: tblis
    summary: 'Actual C++ TBLIS through the direct FFI adapter, as the independent third-party reference
      implementation. Pinned by release tag, not by a local revision: `benchmarks/scripts/build_tblis.sh`
      of the measured checkout builds it from the tag and writes the PROVENANCE this repository records.'
    identity: TBLIS v2.0-beta2 (the only tagged 2.0; its commit and the bundled BLIS revision are recorded
      per run, from `scripts/tblis_providers_json.py`)
    caveat: Needs an install prefix (`TBLIS_ROOT`), and TBLIS 2.x builds through CMake, so the prefix
      cannot be made inside a bare checkout. The page repeats the tag, commit, bundled BLIS revision and
      artifact hash the manifest recorded.
