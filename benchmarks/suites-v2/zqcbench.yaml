    provider: tblis
    summary: Actual C++ TBLIS through the direct FFI adapter, as the independent third-party reference
      implementation. Pinned by release tag, not by a local revision.
    identity: TBLIS v2.0-beta2 (the only tagged 2.0; its commit and the bundled BLIS revision are recorded
      per run, from `scripts/tblis_providers_json.py`)
    caveat: Needs an install prefix (`TBLIS_ROOT`), and TBLIS 2.x builds through CMake. The page repeats
      the tag, commit, bundled BLIS revision and artifact hash the manifest recorded.
