workloads:
  name: |-
    Complex-orbital QC binary-contraction corpus
  description: |-
    One binary (two-operand) contraction per case, transcribed from ten complex-orbital paper routes at fixed occupied/virtual/auxiliary extents: three two-component spinor routes (X2CAMF CCSD/EOM, two-component RI-JK), five periodic k-space routes (periodic CCSD, GDF-HF, GW, BSE and the per-k-point AO-to-MO staging) and two molecular spatial routes (SO-MF/CPSCF and GHF/GKS response). The three ratios stand for the cc-pVDZ/cc-pVTZ/cc-pVQZ rung medians of a 5,239-molecule NAO statistics panel. One family (`ri-krgw/sigma.contract`) carries a batch index.
  source: |-
    The corpus is defined by `benchmarks/benchmarks/zqcbench/corpus.rs` in the measured revision (`pins/tcontract-rs-v2.rev`); each case names the paper it was transcribed from in the corpus README, and the transcription material lives in the benchmark job's `out/complex_corpus/*/CORPUS.md`.
  known_blind_spots:
  - 'One binary contraction per timed call: permutations, denominators and forms with more than two operands
    are metadata, never separate timed cases.'
  - Every case is c64; f64 is the real-orbital bench (`qcbench`), and the shared verifier's known-value
    fixture is a dedicated 12-MAC product, not a corpus family.
  - The extents are aspect-ratio classes derived from a 12 GiB whole-binary c64 budget, not a molecule;
    the binding case is the ao^4 exchange kernel `somf/cpscf.exchange_response` and the verify peak is
    A+B+2C (a blas build would add the TTGT arm).
  - 'The transcription is not machine-checked here: the corpus tests compare the literals against a second
    copy, not against the papers.'
  - '`tblis` is an external baseline linked from its own prefix (`TBLIS_ROOT`), not the measured checkout;
    its revision is recorded through the campaign TBLIS collector (`scripts/tblis_providers_json.py`).'
  - The harness's census CSV carries no corpus `group` column, so the ratio classes are declared by this
    suite and the resolved extents remain facts of the measured revision's `corpus.rs`.
