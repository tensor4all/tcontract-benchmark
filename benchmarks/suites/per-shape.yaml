schema_version: 1
id: per-shape
description: >-
  A per-shape contraction set: small and large batched GEMMs and the steps of a
  32-site MPS chain, at fixed extents. It is measured by `lukbench`, the harness
  that owns this corpus, against the planner's own route, the forced packed
  driver, and TBLIS as the independent reference implementation. The campaign's
  nominal-size axis does not apply: here the cases *are* the shapes.
runner: lukbench
features:
  - tblis
# Same rule as the tcbench suite: only paths whose change can alter a measured result.
invalidated_by:
  - crates/tcontract-kernel/**
  - crates/tcontract/**
  - crates/tcontract-exec/**
  - benchmarks/benchmarks/lukbench/**
  - benchmarks/src/**
  - Cargo.toml
  - Cargo.lock
stale_after: 20
required_profiles:
  - zen5-cpu
corpus:
  name: per-shape contraction set
  description: >-
    Twenty-one cases in four families: `ikb,knb->inb` f64 with i = k = n in
    {2,4,8,16} and batch in {16,64,256}; `ijk,jkl->il` f64 8x16x8x8; `ij,jk->ik`
    c64 n = 32 and f64 n = 64; `ij,jk,kl->il` f64 n = 64 in the fixed pairwise
    order ((ij,jk),kl); and a c64 MPS chain of 32 sites at uniform bond
    dimension chi in {4,8,16,32,64}, two steps per site and one timed call per
    whole chain. They range from an overhead-dominated 0.9 us to a 4.8 ms chain,
    which is the point of the set: the ranking of engines changes across it.
  source: >-
    Reconstructed from the transcribed figure of tcontract-rs#61, which Lukas Devos
    measured on Rusty worker5252 (exclusive node, 2026-09-23, single-threaded,
    median of three repeat arms). His script is not in any public tree, so the
    case definitions are the working assumptions recorded in
    experiments/three-engine-contract/README.md and carried by lukbench's
    corpus, not a copy of his measurement.
  known_blind_spots:
    - "One size per case: a ratio here says nothing about a neighbouring size, and the set is not a sweep."
    - "An MPS chain is one timed call per whole chain, so a per-step cost is a derived quantity, not a measurement."
    - "The corpus is regular by construction: contiguous column-major operands, one batch axis at most, no strided or transposed layouts."
    - >-
      The ratio against the reference compares a prepared plan with a one-shot
      library call. TBLIS 2.0 exposes no prepared-contraction entry point (`tblis.h`
      has `tblis_tensor_mult` and C++ view wrappers, nothing to hoist), so its own
      contraction analysis runs inside the timed call, while tprims's `Plan` is
      constructed outside it by the timing policy. Measured on this host, the
      reference pays a fixed 3.2-4.5 us per contraction at 1T - the same for a 2x2x2
      batch element as for a 16x16x16 one - against 0.02-0.23 us for the prepared
      path, so on the smallest cases this column reports setup, not kernel
      efficiency: the ratio's median is 0.016 for cases under 1 us and 0.75 above
      1 ms, where compute finally dominates.
engines_doc:
  plan:
    label: tprims [plan]
    provider: tprims
    summary: >-
      This library with its planner choosing the route per case: the packed
      driver, or the copy-free faer path, or the elementwise pass for an
      all-batch case.
    identity: tcontract-rs (this repository's pinned revision)
  packed:
    label: tprims [packed]
    provider: tprims
    summary: >-
      This library with the packed driver forced. A diagnostic arm: it shows what
      the planner's other routes buy or cost on the same inputs.
    identity: tcontract-rs (this repository's pinned revision)
  tblis:
    label: tblis
    provider: tblis
    summary: >-
      Actual C++ TBLIS through the direct FFI adapter, as the independent
      third-party reference implementation. Pinned by release tag, not by a local
      revision: `benchmarks/scripts/build_tblis.sh` of the measured checkout builds
      it from the tag and writes the PROVENANCE this repository records.
    identity: TBLIS v2.0-beta2 (the only tagged 2.0; its commit and the BLIS revision are recorded per run)
    caveat: >-
      Needs an install prefix (`TBLIS_ROOT`), and TBLIS 2.x builds through CMake,
      so the prefix cannot be made inside a bare checkout. The page repeats the
      tag, commit, bundled BLIS revision and artifact hash the manifest recorded.
runs:
  - threads: [1, 4]
    cpu_sets: ["4", "4-7"]
    dtypes: [f64, c64]
    engines: [plan, packed, tblis]
    fixed_shapes: true
