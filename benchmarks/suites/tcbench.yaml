schema_version: 1
id: tcbench
description: >-
  The TCCG 49-case tensor-contraction corpus: the only corpus here with rank-3 to
  rank-6 contractions, so it is kept for the irregular strides the packed driver's
  scatter path exists for. It is measured at one size and two widths, against the
  planner's own route, the forced packed driver, and TBLIS as the independent
  reference — the lineage baseline (tensorprimitives-rs) and the third width are
  retired, see docs/worklog.md.
# Restored: TBLIS. It was retired when it could not name its own revision; it now can
# (`benchmarks/scripts/build_tblis.sh` records a release tag, its commit, the bundled
# BLIS revision and an artifact hash), and without it this suite has no independent
# reference, so a reader cannot tell a competitive tprims number from a
# self-consistent one. See docs/worklog.md for the reversal.
# Arms retired from this suite, with reasons in docs/worklog.md: tensorprimitives-rs
# (the project this library was extracted from, so a lineage baseline rather
# than an independent one), the 8-thread width and the 1 MiB size (both cost a
# third of a run each to measure the same question twice).
# Only paths whose change can alter a measured result. Deliberately not
# `benchmarks/**`: a README or AGENTS.md edit does not make a measurement stale,
# and a rule that could not tell the difference would be ignored in practice.
invalidated_by:
  - crates/tcontract-kernel/**
  - crates/tcontract/**
  - crates/tcontract-exec/**
  - benchmarks/benchmarks/tcbench/**
  - benchmarks/src/**
  - Cargo.toml
  - Cargo.lock
stale_after: 20
required_profiles:
  - zen5-cpu
features:
  - tblis
corpus:
  name: TCCG
  description: >-
    One contraction per case, from coupled-cluster (CCSD, CCSD(T)),
    AO-to-MO integral transformation and tensor-times-matrix workloads.
    Each case is a full tensor contraction, not a matrix multiply.
  source: >-
    Springer & Bientinesi, "Design of a High-Performance GEMM-like Tensor-Tensor
    Multiplication" (arXiv:1607.00145), and the accompanying HPAC/tccg
    benchmark.py. Shapes are rescaled from one nominal tensor size by TCCG's
    sizing rule, so the extents are a function of that knob rather than physical
    dimensions.
  known_blind_spots:
    - "Every case has unit batch extent, so a cost proportional to batch elements is invisible here."
    - "Stride-1 extents are rounded up to a multiple of 24, so the corpus is regular by construction."

engines_doc:
  plan:
    label: tprims [plan]
    provider: tprims
    summary: >-
      This library, with its planner choosing the route per case: the packed
      driver, or the copy-free faer path, or the elementwise path for an
      all-batch case.
    identity: tcontract-rs (this repository's pinned revision)
  packed:
    label: tprims [packed]
    provider: tprims
    summary: >-
      This library with the packed driver forced instead of chosen. A
      diagnostic arm: it shows what the planner's non-packed routes buy or cost
      on the same inputs.
    identity: tcontract-rs (this repository's pinned revision)
  tblis:
    label: tblis
    provider: tblis
    summary: >-
      Actual C++ TBLIS through the direct FFI adapter, as the independent third-party
      reference implementation. Pinned by release tag, not by a local revision:
      `benchmarks/scripts/build_tblis.sh` of the measured checkout builds it from the
      tag and writes the PROVENANCE this repository records.
    identity: TBLIS v2.0-beta2 (the only tagged 2.0; its commit and the BLIS revision are recorded per run)
    caveat: >-
      Needs an install prefix (`TBLIS_ROOT`), and TBLIS 2.x builds through CMake, so
      the prefix cannot be made inside a bare checkout. The page repeats the tag,
      commit, bundled BLIS revision and artifact hash the manifest recorded.

runs:
  - threads: [1, 4]
    cpu_sets: ["4", "4-7"]
    sizes_mib: [16]
    dtypes: [f64, c64]
    engines: [plan, packed, tblis]
